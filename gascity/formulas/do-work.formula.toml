description = """
Full lifecycle implementation formula for one implementation convoy or a core
drain-unit convoy of size one.

Launch inputs:
- input_convoy: {{convoy_id}}
- context_path: {{context_path}} (empty means no extra context bundle)
- implementation_target: {{implementation_target}}
- summary_path: {{summary_path}} (empty means use the default item summary path)
- base_branch: {{base_branch}} (empty means the remote default branch)
- require_delivery: {{require_delivery}} (true: the close step cannot pass until the lane's commit is pushed or in a PR)
"""
formula = "do-work"
version = 1
contract = "graph.v2"
extends = ["implementation-base"]
target_required = true

[vars]
[vars.context_path]
description = "Optional context bundle path."
default = ""

[vars.implementation_target]
description = "Role target for implementation work."
default = "gc.implementation-worker"

[vars.summary_path]
description = "Optional per-item summary path."
default = ""

[vars.base_branch]
description = "Branch to cut implementation worktrees from and to target when publishing. Empty means the remote default branch. Set it per rig with formula_vars."
default = ""

[vars.require_delivery]
description = "Set true so close-source-anchor cannot pass until the lane's commit is on an origin branch other than base_branch, or in an open or merged PR. Drain items are exempt: the draining workflow publishes. Set it per rig with formula_vars."
default = "false"

[[steps]]
id = "prepare-worktree"
title = "Prepare item worktree"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/do-work/prepare-worktree.md"

[[steps]]
id = "implement"
title = "Implement owned work"
needs = ["prepare-worktree"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/do-work/implement.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "close-source-anchor"
title = "Close owned source anchor"
needs = ["implement"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/do-work/close-source-anchor.md"

# The check runs after each close attempt; it passes at once unless require_delivery is true
# (assets/scripts/checks/do-work-delivered.sh: 0 delivered or not required, 1 not yet, 75 infra).
[steps.check]
max_attempts = 2

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/do-work-delivered.sh"
timeout = "2m"
